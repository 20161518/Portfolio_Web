<section id="contato" class="section">
    <div class="section-content container">
        <h2 class="section-title">Contato</h2>
        <p>
            Sinta-se à vontade para entrar em contato comigo através do formulário abaixo. Estou aberto a novas
            oportunidades, colaborações, feedbacks e para discutir como posso contribuir para seus projetos.
        </p>
        <form id="contact-form">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="Júlio César Mathes" required>
                <small class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <small class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
                <small class="error-message"></small>
            </div>
            <button type="submit" class="btn">Enviar</button>
        </form>
    </div>
</section>
